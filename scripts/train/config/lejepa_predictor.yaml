# Stage-D predictor on a frozen LeJEPA encoder. Arms A and R differ only in
# `encoder`; every other field is held fixed so the comparison isolates what
# encoder training bought.

defaults:
  - _self_
  - launcher: local
  - data: ogb_cube_single_pred

output_model_name: lejepa_predictor
subdir: ${hydra:job.id}

# A checkpoint path for arm A, or the literal `random` for arm R.
encoder: lejepa/weights_epoch_100.pt

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: small
embed_dim: 384

# Predictor capacity is held identical across arms A, R, P and C -- the plan
# compares representations, not transition models.
predictor_hidden_dim: 512

wm:
  history_size: 3
  num_preds: 1

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  drop_last: True
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True
  shuffle: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

# Arm R's encoder: identical architecture, untrained. Instantiated only when
# `encoder: random`.
random_encoder:
  _target_: stable_worldmodel.wm.lejepa.LeJEPA
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: ${encoder_scale}
    patch_size: ${patch_size}
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  head:
    _target_: stable_worldmodel.wm.lejepa.NDimHead
    input_dim: ${embed_dim}
    output_dim: 12       # must match the encoder dataset's n (task_content:
                         # 9 physical + 3 cube.color at n_cubes = 1)
    hidden_dim: 2048

model:
  _target_: stable_worldmodel.wm.lejepa.module.FrozenEncoderWM
  encoder_hash: null     # filled in at runtime from the loaded encoder
  predictor:
    _target_: stable_worldmodel.wm.lejepa.module.Predictor
    num_frames: ${wm.history_size}
    input_dim: ???       # = encoder.output_dim, set at runtime
    hidden_dim: ${predictor_hidden_dim}
    output_dim: ???
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: stable_worldmodel.wm.lejepa.module.Embedder
    input_dim: ???
    emb_dim: ???

wandb:
  enabled: false
  config:
    project: lejepa-identifiability
