# LeJEPA encoder training: passive, action-free, on designed OU pairs.

defaults:
  - _self_
  - launcher: local
  # Carries the backbone, the head's shape and the optimiser settings
  # calibrated for it. `encoder=vit_small` swaps all four together, so the
  # arch and its learning rate can never drift apart.
  - encoder: paper_cnn
  - data: ogb_cube_single_ou

# Which latent profile's dataset to train on. `physical_content` (n=10) is the
# only shipped one: the 9 physical DOFs plus cube.size. It must match the
# profile the dataset was collected under -- it is interpolated into the
# dataset name, so a disagreement looks for a dataset that was never written.
#
# camera.angle_delta is excluded and pinned, so no camera randomisation reaches
# the encoder. See identifiability/latents.py for why cube.size is content and
# the camera is pinned -- both share a rendering channel with a content latent.
profile: physical_content

output_model_name: lejepa
# NOT ${hydra:job.id}: that resolves to an empty string on a plain single run,
# so config.yaml and encoder_hash.txt land in the checkpoints/ root and the
# next run silently overwrites them -- and the hash is the only way to pair a
# predictor with the encoder it was trained against.
subdir: ${output_model_name}_s${seed}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224

# Frozen, and copied verbatim into every results row by the metric writer. A
# run that deviates is a visible event rather than a footnote -- which is only
# enforceable if they live in one place. Keep `rho` equal to the collector's;
# `run_metrics.py` reads the dataset manifest's `rho` in preference to this, so
# a disagreement shows up as a manifest/row mismatch rather than silently.
program_constants:
  rho: 0.9          # mid-range of Fig. 6's best region, clear of the rho=0.99 collapse

  # In the PAPER's units -- see `loss.sigreg.kwargs.pool_views` below, which is
  # what makes that true. Chosen from the paper's lambda x rho grid (Fig. 6 /
  # App. H.6) read at OUR rho. At rho=0.9 the four candidates
  # {1e-3, 5e-3, 1e-2, 5e-2} are indistinguishable on R^2(h->z) and separated
  # only by orthogonality error, where 5e-2 is the best in the whole column:
  #
  #   lambda   1e-3    5e-3    1e-2    5e-2
  #   R^2      0.981   0.989   0.993   0.992
  #   orth     0.461   0.210   0.142   0.062
  #
  # Orthogonality error is what our recovery metrics actually score, so it is
  # the row that decides. Note that App. H.6's *prose* names lambda in
  # {1e-3, 5e-3} as the best setting, which its own table contradicts at
  # rho=0.9 -- the table is what is cited here. 5e-2 degrades only from 1e-1
  # (0.847), and at rho=0.99 it falls to 0.493, which is the collapse
  # `program_constants.rho` above is staying clear of.
  #
  # The previous 3.0e-3 was 1.5e-3 in paper units under the per-view
  # convention -- ~30x below the paper's best pixel setting, and only ~15x above
  # the lambda < 1e-4 regime Fig. 6 shows fails outright at every rho. That is
  # the wrong side to err on here: `bound/trace_cov` starts near 1.4 against
  # n=10, so SIGReg has to *inflate* the representation out of near-collapse,
  # and the risk is asymmetric -- too low fails outright, too high degrades
  # gracefully (0.847 at 1e-1; only 5e-1 collapses).
  #
  # Confirm on the shakedown before spending the seed budget:
  #   for l in 1.0e-2 5.0e-2; do
  #     python scripts/train/lejepa.py program_constants.lambda=$l \
  #         trainer.max_epochs=10 subdir=lam_$l
  #   done
  # If `fit/align_loss` stops falling, SIGReg is dominating: drop to 1e-2.
  # Read `fit/align_loss` against its floor, `(1 - rho) * trace_cov / (2 n)`,
  # NOT against zero -- and read it in `validate/`, since train-mode BatchNorm
  # flatters anything computed from the two views' difference.
  lambda: 5.0e-2

trainer:
  # A pure budget knob now that `schedule.warmup_steps` is absolute -- see the
  # schedule block below for what it used to also move.
  max_epochs: 100
  # SIGReg is a *batch* statistic scaled by the batch size and is never
  # gathered across ranks (`wm/loss.py`: "only support single-gpu"). On two
  # devices you would silently get two statistics over half the batch each,
  # which changes the effective lambda and moves the run off the calibrated
  # (lambda, rho) region. It would also halve the batch every train-time
  # BatchNorm normalises over. Pinned rather than `auto`.
  devices: 1
  accelerator: gpu
  # NOT bf16. SIGReg's inner term is `(cos_mean - phi)^2`, a difference of two
  # O(1) quantities whose true value is O(1/sqrt(B)) ~ 0.06, then multiplied by
  # B. In bf16's 8-bit mantissa that subtraction keeps about one significant
  # digit -- catastrophic cancellation in the only term preventing collapse.
  precision: 32
  gradient_clip_val: 1.0

# Lightning trainer-state checkpoints -- weights *plus* optimizer, scheduler and
# RNG, which is what a killed pod resumes from. Distinct from the
# `weights_epoch_N.pt` that `SaveCkptCallback` writes: those are weights only and
# are what the metric suite scores.
#
# The DIRECTORY is deliberately absent, because it cannot be set from here.
# `spt.Manager` always runs in cache_dir mode (a cache_dir is mandatory --
# passing None raises) and `_configure_cache_dir_checkpointing` redirects every
# ModelCheckpoint's `dirpath` into
# `$SPT_CACHE_DIR/runs/<date>/<time>/<run_id>/checkpoints/`. What IS settable is
# the cache root, via `SPT_CACHE_DIR`. The resolved directory is written to
# `checkpoints/${subdir}/lightning_ckpt_dir.txt` (plus a `lightning` symlink
# beside it) at train start, so it is knowable while the run is still going
# rather than only afterwards.
checkpoint:
  # One retained `epochNNN.ckpt` per epoch instead of only a rolling `last.ckpt`.
  #
  # Resume works either way: Manager's requeue saver writes `last.ckpt` every
  # epoch regardless (`spt.set(requeue_checkpoint=False)` turns that off). This
  # decides whether you can go back to a *specific* epoch -- which for a
  # single-seed run whose whole output is a 10-point trend is worth the disk:
  # ~34 MB/epoch for `paper_cnn` (2.86M params x fp32 x ~3 for AdamW state),
  # ~270 MB/epoch for `vit_small`.
  #
  # NOTE: Lightning counts epochs from 0 and `SaveCkptCallback` counts from 1,
  # so `epoch004.ckpt` is the trainer state that produced `weights_epoch_5.pt`.
  keep_every_epoch: true

loader:
  batch_size: 256
  num_workers: ${num_workers}
  drop_last: True
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True
  shuffle: True

optimizer:
  type: AdamW
  # From the encoder group: the CNN wants 3e-3/1e-4 (App. H.11), the ViT
  # 5e-5/1e-3 (LeWM). Interpolated so switching `encoder=` switches these too.
  lr: ${encoder_lr}
  weight_decay: ${encoder_weight_decay}

# The LR schedule. Both of its ends used to ride on `trainer.max_epochs`, so
# changing the budget moved the budget, the warmup length AND the anneal rate at
# once and none of the three could be isolated. Now: `warmup_steps` is absolute,
# `constant_frac` sets the shape, and `max_epochs` is a pure budget knob.
#
# Implemented by `wm/lejepa/schedule.py::WarmupHoldCosineLR` -- linear warmup,
# a hold at the peak, then cosine to zero. One scheduler, one knob for the
# shape. It replaced spt's `LinearWarmupCosineAnnealingLR`, which has no hold
# phase (so the paper's recipe could not be expressed), encoded `constant` as
# `eta_min == base_lr` (a dropped kwarg would silently give a real anneal), and
# left its cosine unclamped past `max_steps`.
schedule:
  # ABSOLUTE, not `int(0.01 * total_steps)`. At 703 steps/epoch the old rule
  # gave a 10-epoch run 70 warmup steps and a 100-epoch run 703 -- a 10x
  # difference in ramp aggressiveness attributable purely to the budget, so no
  # two budgets were comparable. 700 is kept as the fixed reference.
  warmup_steps: 700

  # Fraction of the run held at the peak LR before the cosine anneal begins.
  # The ONLY shape knob:
  #
  #   0.5  the paper's recipe (App. H.4): "constant learning rate for the first
  #        half of training, followed by cosine decay to zero". THE DEFAULT.
  #   0.0  pure cosine from the end of warmup. What this repo ran before, and
  #        it wastes the budget: lr is already at 50% of peak by the halfway
  #        point, so a large `max_epochs` buys mostly anneal, not learning.
  #   1.0  flat forever. The old `shape: constant`.
  #
  # Why a hold AND an anneal, rather than either alone. The hold is what buys
  # representation learning; the anneal is what makes the final number mean
  # anything. A constant LR does not converge, it orbits in a noise ball whose
  # radius scales with the LR, and `align_loss` is a difference of the two
  # views' embeddings -- exactly the quantity a jittering encoder inflates.
  # Measured: the 25-epoch constant run plateaued at 2.29x its alignment floor,
  # where the paper's annealed runs sit at 0.976x of theirs. That plateau was an
  # artefact of the LR, not a ceiling. Symmetrically, a pure cosine anneals away
  # the LR before the representation has had its high-LR phase.
  #
  # Consequences to keep in mind:
  #   * mid-run checkpoints inside the anneal are NOT comparable to each other,
  #     since each sits at its own LR. Those in the hold phase ARE. Read the
  #     trend for its shape, not for the epoch at which it turns over.
  #   * DO NOT early-stop. The anneal is the payoff and there is no resume
  #     (`ckpt_path=None` in lejepa.py), so a killed run is not a shorter run,
  #     it is a checkpoint frozen at peak LR. At 0.5 the whole first half is at
  #     peak, so killing anywhere in it forfeits the entire anneal.
  constant_frac: 0.5

model:
  _target_: stable_worldmodel.wm.lejepa.LeJEPA
  encoder: ${encoder_spec}
  head:
    _target_: stable_worldmodel.wm.lejepa.NDimHead
    input_dim: ${embed_dim}
    # null => take n from the dataset's own `latent/z` width, so m = n by
    # construction and the head can never silently disagree with the ground
    # truth the metrics score against. Set it explicitly to ask for a narrower
    # head on purpose; `recovery_diagnostics` then returns nothing (no square Q
    # to align with) and the per-latent probe in run_metrics.py is what still
    # applies.
    output_dim: null
    # Shape follows the encoder: bare `Linear(256, n)` for the paper CNN, whose
    # projection already ends in BatchNorm1d + GELU; LayerNorm + a 2048 hidden
    # layer for the ViT. Never a norm *after* the output -- that would force
    # diag(Cov(h)) to 1 and partly trivialise both epsilon and SIGReg.
    hidden_dim: ${head_hidden_dim}
    norm: ${head_norm}
    # BatchNorm1d on the hidden layer for the ViT arms, null (unused, no
    # hidden layer) for the CNN -- see `NDimHead.hidden_norm_fn`.
    hidden_norm_fn: ${head_hidden_norm_fn}

loss:
  sigreg:
    kwargs:
      knots: 17
      num_proj: 1024
      # Pool the two views into one set of 2B samples, as the identifiability
      # paper's own implementation does, instead of taking a per-view statistic
      # and averaging. Away from the optimum the pooled statistic is exactly 2x
      # the per-view one (measured 2.00x), so this is what puts
      # `program_constants.lambda` in the same units as the paper's figures
      # rather than leaving a factor of 2 to be remembered forever.
      #
      # LeWM keeps the per-view default: its baselines were trained under it.
      pool_views: true

wandb:
  enabled: false
  config:
    project: lejepa-identifiability
