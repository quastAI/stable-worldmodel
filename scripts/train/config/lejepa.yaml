# LeJEPA encoder training: passive, action-free, on designed OU pairs.

defaults:
  - _self_
  - launcher: local
  # Carries the backbone, the head's shape and the optimiser settings
  # calibrated for it. `encoder=vit_small` swaps all four together, so the
  # arch and its learning rate can never drift apart.
  - encoder: paper_cnn
  - data: ogb_cube_single_ou

# Which latent profile's dataset to train on. `physical_content` (n=10) is the
# stage-A exit criterion: the 9 physical DOFs plus cube.size. `task_content`
# (n=13) additionally puts cube.color in z, which is entangled with the
# lighting that stays style -- a deliberate, separately-reported arm, not the
# default. `arm_c_content` (n=9) drops cube.size for the consumers that need a
# privileged/proprio readback for every content latent.
#
# camera.angle_delta is excluded in every profile, so no camera DR reaches the
# encoder. See identifiability/latents.py for why cube.size is content and the
# camera is pinned -- both share a rendering channel with a content latent.
profile: physical_content

output_model_name: lejepa
# NOT ${hydra:job.id}: that resolves to an empty string on a plain single run,
# so config.yaml and encoder_hash.txt land in the checkpoints/ root and the
# next run silently overwrites them -- and the hash is the only way to pair a
# predictor with the encoder it was trained against.
subdir: ${output_model_name}_s${seed}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224

# Frozen before Env 1 and copied verbatim into every result row by the metric
# writer. A run that deviates from these is a first-class event in the scatter,
# not a footnote -- which is only enforceable if they live in one place.
program_constants:
  rho: 0.9          # mid-range of Fig. 6's best region, clear of the rho=0.99 collapse

  # In the PAPER's units -- see `loss.sigreg.kwargs.pool_views` below, which is
  # what makes that true. Chosen from App. H.11, the paper's own *pixel*
  # experiment, not from Fig. 6's 2-D grid: Fig. 14 sweeps
  # lambda in {1e-3, 5e-3, 1e-2, 5e-2} on a CNN and 5e-2 is the best of them at
  # rho=0.9 (~0.93 against ~0.75-0.82 for the three lower values). Fig. 6 puts
  # 5e-2 at rho=0.9 in its good region too (0.992), degrading only from 1e-1.
  #
  # The previous 3.0e-3 was 1.5e-3 in paper units under the per-view
  # convention -- ~30x below the paper's best pixel setting, and only ~15x above
  # the lambda < 1e-4 regime Fig. 6 shows fails outright at every rho. That is
  # the wrong side to err on here: `bound/trace_cov` starts near 1.4 against
  # n=10, so SIGReg has to *inflate* the representation out of near-collapse,
  # and the risk is asymmetric -- too low fails outright, too high degrades
  # gracefully (0.847 at 1e-1; only 5e-1 collapses).
  #
  # Confirm on the shakedown before spending the seed budget:
  #   for l in 1.0e-2 5.0e-2; do
  #     python scripts/train/lejepa.py program_constants.lambda=$l \
  #         trainer.max_epochs=10 subdir=lam_$l
  #   done
  # If `fit/align_loss` stops falling, SIGReg is dominating: drop to 1e-2.
  lambda: 5.0e-2
  seed_budget: 5

trainer:
  max_epochs: 100      # V8 shortens this; severity 0 is the full schedule
  # SIGReg is a *batch* statistic scaled by the batch size and is never
  # gathered across ranks (`wm/loss.py`: "only support single-gpu"). On two
  # devices you would silently get two statistics over half the batch each,
  # which changes the effective lambda and moves the run off the calibrated
  # (lambda, rho) region. Pinned rather than `auto`.
  devices: 1
  accelerator: gpu
  # NOT bf16. SIGReg's inner term is `(cos_mean - phi)^2`, a difference of two
  # O(1) quantities whose true value is O(1/sqrt(B)) ~ 0.06, then multiplied by
  # B. In bf16's 8-bit mantissa that subtraction keeps about one significant
  # digit -- catastrophic cancellation in the only term preventing collapse.
  precision: 32
  gradient_clip_val: 1.0

loader:
  batch_size: 256
  num_workers: ${num_workers}
  drop_last: True
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True
  shuffle: True

optimizer:
  type: AdamW
  # From the encoder group: the CNN wants 3e-3/1e-4 (App. H.11), the ViT
  # 5e-5/1e-3 (LeWM). Interpolated so switching `encoder=` switches these too.
  lr: ${encoder_lr}
  weight_decay: ${encoder_weight_decay}

model:
  _target_: stable_worldmodel.wm.lejepa.LeJEPA
  encoder: ${encoder_spec}
  head:
    _target_: stable_worldmodel.wm.lejepa.NDimHead
    input_dim: ${embed_dim}
    # null => take n from the dataset's own `latent/z` width, so m = n by
    # construction. Set explicitly for V7a (n - k) or V7b (n + k).
    output_dim: null
    # Shape follows the encoder: bare `Linear(256, n)` for the paper CNN, whose
    # projection already ends in BatchNorm1d + GELU; LayerNorm + a 2048 hidden
    # layer for the ViT. Never a norm *after* the output -- that would force
    # diag(Cov(h)) to 1 and partly trivialise both epsilon and SIGReg.
    hidden_dim: ${head_hidden_dim}
    norm: ${head_norm}
    # BatchNorm1d on the hidden layer for the ViT arms, null (unused, no
    # hidden layer) for the CNN -- see `NDimHead.hidden_norm_fn`.
    hidden_norm_fn: ${head_hidden_norm_fn}

loss:
  sigreg:
    kwargs:
      knots: 17
      num_proj: 1024
      # Pool the two views into one set of 2B samples, as the identifiability
      # paper's own implementation does, instead of taking a per-view statistic
      # and averaging. Away from the optimum the pooled statistic is exactly 2x
      # the per-view one (measured 2.00x), so this is what puts
      # `program_constants.lambda` in the same units as the paper's figures
      # rather than leaving a factor of 2 to be remembered forever.
      #
      # LeWM keeps the per-view default: its baselines were trained under it.
      pool_views: true

wandb:
  enabled: false
  config:
    project: lejepa-identifiability
