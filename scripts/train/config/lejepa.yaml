# LeJEPA encoder training: passive, action-free, on designed OU pairs.

defaults:
  - _self_
  - launcher: local
  - data: ogb_cube_single_ou

output_model_name: lejepa
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: small
embed_dim: 384

# Frozen before Env 1 and copied verbatim into every result row by the metric
# writer. A run that deviates from these is a first-class event in the scatter,
# not a footnote -- which is only enforceable if they live in one place.
program_constants:
  rho: 0.9          # mid-range of Fig. 6's best region, clear of the rho=0.99 collapse
  lambda: 3.0e-3    # in [1e-3, 1e-2] per Fig. 6
  seed_budget: 5

trainer:
  max_epochs: 100      # V8 shortens this; severity 0 is the full schedule
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 128
  num_workers: ${num_workers}
  drop_last: True
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True
  shuffle: True

optimizer:
  type: AdamW
  lr: 5e-5
  weight_decay: 1e-3

model:
  _target_: stable_worldmodel.wm.lejepa.LeJEPA
  encoder:
    # The LeWM baseline backbone, unchanged, so encoder capacity is held fixed
    # against that baseline rather than becoming another free variable.
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: ${encoder_scale}
    patch_size: ${patch_size}
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  head:
    _target_: stable_worldmodel.wm.lejepa.NDimHead
    input_dim: ${embed_dim}
    # null => take n from the dataset's own `latent/z` width, so m = n by
    # construction. Set explicitly for V7a (n - k) or V7b (n + k).
    output_dim: null
    hidden_dim: 2048
    norm: true

loss:
  sigreg:
    kwargs:
      knots: 17
      num_proj: 1024

wandb:
  enabled: false
  config:
    project: lejepa-identifiability
