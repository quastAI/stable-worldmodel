defaults:
  - _self_
  - launcher: local
  - data: pusht

output_model_name: smwm
subdir: ${hydra:job.id}

num_workers: 6
train_split: 0.9
seed: 3072
img_size: 224
patch_size: 14
encoder_scale: small
embed_dim: 384
encoder_resnet9: False
train_value_function: False
projector_loss_weight: 1e-3
dump_object: True

trainer:
  max_epochs: 100
  devices: auto
  accelerator: gpu
  precision: bf16
  gradient_clip_val: 1.0

loader:
  batch_size: 256
  num_workers: ${num_workers}
  drop_last: True
  persistent_workers: True
  prefetch_factor: 3
  pin_memory: True
  shuffle: True

optimizer:
  type: AdamW
  # linearly scaled from the LeWM baseline (5e-5 at batch 128) for batch 256
  lr: 1e-4
  weight_decay: 1e-3

wm:
  history_size: 3
  num_preds: 1

model:
  _target_: stable_worldmodel.wm.smwm.SMWM
  encoder:
    _target_: stable_pretraining.backbone.utils.vit_hf
    size: ${encoder_scale}
    patch_size: ${patch_size}
    image_size: ${img_size}
    pretrained: false
    use_mask_token: false
  predictor:
    _target_: stable_worldmodel.wm.smwm.module.Predictor
    num_frames: ${wm.history_size}
    input_dim: ${embed_dim}
    hidden_dim: ${embed_dim}
    output_dim: ${embed_dim}
    depth: 6
    heads: 16
    mlp_dim: 2048
    dim_head: 64
    dropout: 0.1
    emb_dropout: 0.0
  action_encoder:
    _target_: stable_worldmodel.wm.smwm.module.Embedder
    input_dim: ???
    emb_dim: ${embed_dim}
  projector:
    _target_: stable_worldmodel.wm.smwm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  pred_proj:
    _target_: stable_worldmodel.wm.smwm.module.MLP
    input_dim: ${embed_dim}
    output_dim: ${embed_dim}
    hidden_dim: 2048
    norm_fn:
      _target_: torch.nn.BatchNorm1d
      _partial_: true
  # Inverse dynamics model: (z_t, z_{t+1}) -> a_t. Held inside the world model
  # so it round-trips through save_pretrained/load_pretrained.
  inverse_model:
    _target_: stable_worldmodel.wm.smwm.module.InverseModel
    embed_dim: ${embed_dim}
    action_dim: ??? # set in run(): frameskip * dataset.get_dim('action')
    hidden_dim: ${inverse.hidden_dim}

inverse:
  hidden_dim: 256

loss:
  # Off by default: the IDM is the anti-collapse term for this model (a collapsed
  # latent cannot recover the action that joined two states). Kept configurable
  # so `loss.sigreg.weight=0.09` reproduces the LeWM baseline objective. NOTE the
  # SIGReg statistic scales with batch size, so 0.09 was tuned at batch 128.
  sigreg:
    weight: 0.0
    kwargs:
      knots: 17
      num_proj: 1024
  # Sensorimotor objective: L = L_fwd + inverse.weight * L_inv.
  # At 0.0 nothing regularizes the latent and the encoder is free to collapse.
  inverse:
    weight: 1.0
