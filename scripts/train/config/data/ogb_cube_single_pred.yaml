# The predictor dataset: physics rollouts, not designed OU pairs.
#
# V1-V4 and V9 do not apply here (plan SS0.1). This dataset is collected for
# its own requirements -- action-space coverage, persistent excitation,
# task-relevant state visitation -- so its marginal is whatever the policy
# mixture produces and is not supposed to be Gaussian.
dataset:
  name: ogbench/cube_single_predictor.lance
  num_steps: ${eval:'${wm.num_preds} + ${wm.history_size}'}
  frameskip: 5
  keys_to_load:
    - pixels
    - action
    - observation
    - proprio/joint_pos
    - proprio/joint_vel
    - proprio/effector_pos
    - proprio/effector_yaw
    - proprio/gripper_opening
    - proprio/gripper_vel
    - proprio/gripper_contact
  keys_to_cache:
    - action
    - observation
  keys_to_merge:
    proprio: proprio
