defaults:
  - _self_
  - launcher/local

hydra:
  output_subdir: null
  mode: MULTIRUN
  run:
    dir: .

cache_dir: null
dataset_name: ogbench/cube_quadruple_dr_expert.lance

world:
  num_envs: 10
  # Upstream generates cube-quadruple play data with 1001-step episodes,
  # giving ~11 chained pick-and-places per episode.
  max_episode_steps: 1000
  image_shape: [224, 224]

# Forwarded to gym.make -> DRCubeEnv. Keep these identical in the eval config:
# the dataset stores background/digit *indices*, so a differently sized pool
# would resolve them to different materials.
env:
  env_type: quadruple
  ob_type: states
  multiview: False
  width: 224
  height: 224
  visualize_info: False
  terminate_at_goal: False
  num_digits: 5
  num_bg_materials: 8
  add_backdrop: True

# 'plan_oracle' == CubePlanOracle, used for OGBench's `-play` datasets. It
# grasps at the cube's live pose, so it needs no changes under size
# randomization. 'markov_oracle' hard-codes 0.02/0.04 alignment thresholds and
# 0.16-0.18 m lift heights and would need loosening first.
policy_type: plan_oracle

num_workers: 4
seed: 3072
num_traj: 5000

options:
  variation:
    - all
