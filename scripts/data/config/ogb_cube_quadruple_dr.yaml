defaults:
  - _self_
  - launcher/local

hydra:
  output_subdir: null
  mode: MULTIRUN
  run:
    dir: .

cache_dir: null
dataset_name: ogbench/cube_quadruple_dr_expert.lance

world:
  num_envs: 10
  max_episode_steps: 400
  image_shape: [224, 224]


env:
  env_type: quadruple
  ob_type: states
  multiview: False
  width: 224
  height: 224
  visualize_info: False
  terminate_at_goal: False
  num_digits: 1
  num_bg_materials: 8
  add_backdrop: True
policy_type: plan_oracle
seed: 3072
num_traj: 5000

# Sharded collection. `shard` takes an even slice of `num_traj` and a disjoint
# block of episode seeds, and writes `<dataset_name>_shard{i}`. Driven by
# collect_cube_quadruple_dr_sharded.py; leave at 0/1 for a single process.
shard: 0
num_shards: 1

options:
  variation:
    - all
