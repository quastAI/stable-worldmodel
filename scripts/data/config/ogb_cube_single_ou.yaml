# Encoder dataset for the LeJEPA identifiability study (Env 1, stage A).
#
# Every decision the research plan leaves open is a knob here, not a constant
# in the code. The three blocks that matter are `program_constants` (frozen
# before Env 1 and copied verbatim into every result row), `latents` (which
# decides what z is, and therefore n), and `violation`.

defaults:
  - _self_

dataset_name: ogbench/cube_single_ou.lance
cache_dir: null
write_mode: overwrite

# Sized against the phase-0 throughput benchmark: at ~165 frames/s a 200k-pair
# dataset is 400k frames, ~0.67 core-hours in one process. Shard for more.
num_pairs: 200000
seed: 3072

shard: 0
num_shards: 1

# Frozen before Env 1. Any run that deviates from these is flagged as a
# first-class event in the scatter, so they live here rather than being passed
# around per-script.
program_constants:
  rho: 0.9          # mid-range of Fig. 6's best region, clear of the rho=0.99 collapse
  lambda: 3.0e-3    # in [1e-3, 1e-2] per Fig. 6
  seed_budget: 5

env:
  env_type: single
  image_size: 224
  # No floor digit distractors. They exist to give a linear probe a nuisance
  # target in the DR benchmark; nothing here reads them, and against a scene
  # whose content latents are already small in the frame they are pure
  # occlusion risk.
  num_digits: 0
  camera: front_pixels
  # The arm is NOT faded. Upstream OGBench renders it at alpha 0.1 so it does
  # not occlude the object in a manipulation benchmark -- but effector.pos,
  # effector.yaw and gripper.opening are content latents the encoder must
  # recover here, so hiding them would be self-defeating.
  pixel_transparent_arm: false
  marker:
    # Off. A decal breaks the cube's 4-fold yaw symmetry, but that symmetry is
    # a symmetry of the *grasping task* too: yaw and yaw+pi/2 are one state
    # under two names. Sampling yaw on one fundamental domain (below) makes it
    # identifiable without scoring the encoder on a quadrant index no grasp
    # depends on. Enable only to study the full circle deliberately.
    enabled: false
    face: top
    scale: 0.85

latents:
  # 'task_content' is the stage-A exit-criterion profile: the physical DOFs
  # plus cube.color as content, everything else style. n = 9 + 3 * n_cubes
  # here, not the physical-only n=9 that violations.py / run_v4_calibration.py
  # calibrate against -- those predate cube.color joining this profile.
  # 'all_content' (n=54) leaves no continuous style at all, so the
  # style-invariance metric is vacuous under it -- run as a scaling datapoint.
  profile: task_content_color

  # One fundamental domain of the cube's C4 yaw symmetry (pi/4, less a 5%
  # margin so the arc's two endpoints -- which are the SAME configuration --
  # cannot both collect clipped mass). Yaw is then identifiable from the
  # silhouette alone, and the coordinate is a coordinate on the quotient
  # rather than on the raw circle. Widening past pi/4 requires marker.enabled.
  yaw_half_arc: 0.7461282552275249

  # Off under the yaw-only decision. The sampler's tangent-space branch is
  # written and tested but unused.
  include_roll_pitch: false

  # Discrete latents are renderable and hence content-capable, but have no
  # Gaussian marginal -- a structural V1. Off by default; when on, the
  # monotone-recovery metric is reported instead of the linear one.
  include_discrete: false

  # Above the table on purpose. Lifted, table-clipped and interpenetrating
  # cubes are all allowed, which is what makes the induced V5 baseline zero by
  # construction in stage A.
  pos_z_max: 0.15

# Sampler knobs not driven by `violation`. A violation's own kwargs override
# whatever is set here, so the two cannot silently disagree.
ou:
  dist: gaussian
  alpha: null
  noise_coupling: 0.0
  cross_corr: 0.0

violation:
  name: none
  severity: 0.0

style:
  # Style latents are resampled *within* a pair -- the two views get
  # independent draws. This is what the alignment term is asked to discard.
  resample_within_pair: true
