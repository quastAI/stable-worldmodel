# Encoder dataset for the LeJEPA identifiability study.
#
# Every decision the research plan leaves open is a knob here, not a constant
# in the code. Two blocks matter: `program_constants` (frozen, and copied
# verbatim into every results row) and `latents` (which decides what z is, and
# therefore n).

defaults:
  - _self_

# The profile is in the name on purpose: a different profile is a different z
# and therefore a different dataset, and sharing one filename would mean
# whichever ran last silently became "the" encoder set, with only the
# manifest's config_hash to tell afterwards.
#
# Style probe for the style-invariance metric -- same collector, content held
# fixed (see `program_constants.rho` below):
#   dataset_name=ogbench/cube_single_ou_style_${latents.profile}.lance \
#   program_constants.rho=0.99999999
dataset_name: ogbench/cube_single_ou_${latents.profile}.lance
cache_dir: null
write_mode: overwrite

# Sized against the phase-0 throughput benchmark: at ~165 frames/s a 200k-pair
# dataset is 400k frames, ~0.67 core-hours in one process. Shard for more.
num_pairs: 200000
seed: 3072

shard: 0
num_shards: 1

# Frozen, and copied verbatim into every results row, so a run that deviates is
# a visible event rather than a footnote.
#
# `lambda` is recorded here but NOT used by collection -- it is the encoder's
# knob. Keep it equal to `lejepa.yaml`'s `program_constants.lambda` (5.0e-2);
# they were 3.0e-3 and 5.0e-2 respectively for a while, and the stale value
# landed in every row.
program_constants:
  rho: 0.9          # mid-range of Fig. 6's best region, clear of the rho=0.99 collapse
  lambda: 5.0e-2    # App. H.11's best pixel setting at rho=0.9

env:
  env_type: single
  image_size: 224
  # No floor digit distractors. They exist to give a linear probe a nuisance
  # target in the DR benchmark; nothing here reads them, and against a scene
  # whose content latents are already small in the frame they are pure
  # occlusion risk.
  num_digits: 0
  camera: front_pixels
  # The arm is NOT faded. Upstream OGBench renders it at alpha 0.1 so it does
  # not occlude the object in a manipulation benchmark -- but effector.pos,
  # effector.yaw and gripper.opening are content latents the encoder must
  # recover here, so hiding them would be self-defeating.
  pixel_transparent_arm: false
  marker:
    # Off. A decal breaks the cube's 4-fold yaw symmetry, but that symmetry is
    # a symmetry of the *grasping task* too: yaw and yaw+pi/2 are one state
    # under two names. Sampling yaw on one fundamental domain (below) makes it
    # identifiable without scoring the encoder on a quadrant index no grasp
    # depends on. Enable only to study the full circle deliberately.
    enabled: false
    face: top
    scale: 0.85

latents:
  # MUST match `profile` in lejepa.yaml and metrics.yaml. They interpolate it
  # into the dataset name, so a disagreement here does not warn -- it just
  # makes training look for a dataset collection never wrote.
  #
  # `physical_content` (n=10) is the only shipped profile: the 9 physical DOFs
  # plus cube.size. cube.size is content, not style, because it shares the
  # apparent-footprint cue with cube.pos_z and dominates it -- as style it
  # would demand a size-invariant height estimate from shading alone; as
  # content it only has to span the subspace the two generate. See
  # identifiability/latents.py for the measurements.
  #
  # camera.angle_delta is `excluded` and pinned: at +-10 deg it moves the
  # cube's image centroid 32-36 px, more than cube.pos_xy's x component moves
  # across its entire range (24-31 px), so it is a nuisance larger than the
  # signal -- and eval holds the camera fixed anyway.
  profile: physical_content

  # One fundamental domain of the cube's C4 yaw symmetry (pi/4, less a 5%
  # margin so the arc's two endpoints -- which are the SAME configuration --
  # cannot both collect clipped mass), making the coordinate one on the
  # quotient rather than on the raw circle. Widening past pi/4 requires
  # marker.enabled.
  #
  # Be careful reading a yaw-recovery number off this. Pixel separability is
  # NOT monotone in angular error: measured at 224x224 on an unmarked cube,
  # rms is 3.79 at 21 deg, 4.36 at 43 deg and 1.17 at 86 deg, because 90 deg
  # *is* the identification. The arc is 85.5 deg wide, so its two endpoints are
  # the LEAST separable pair in it, and yaw's observable signal is weakest
  # exactly where the coordinate says the error is largest.
  yaw_half_arc: 0.7461282552275249

  # Above the table on purpose: lifted, table-clipped and interpenetrating
  # cubes are all allowed, so no occlusion or support effect is smuggled in
  # through the height range.
  pos_z_max: 0.15

style:
  # Style latents are resampled *within* a pair -- the two views get
  # independent draws. This is what the alignment term is asked to discard,
  # and it is load-bearing rather than incidental: independent draws put style
  # at autocorrelation 0, so the transition operator ranks it below even
  # content's degree-2 Hermite terms (0.90 > 0.81 > ... > 0 at rho=0.9) and the
  # top-n eigenspace is exactly the content block.
  #
  # Setting this false does NOT recover the theory's setting -- it is strictly
  # worse. A shared draw is *perfectly* correlated across the pair, so
  # rho_style = 1, above content's 0.90: alignment is then minimised exactly by
  # encoding style and ignoring content, since the two views agree on style by
  # construction. Only meaningful together with a profile that pins style
  # (every non-content latent 'excluded'); that combination is the literal
  # x = g(z). This flag on its own is degenerate.
  resample_within_pair: true

  # Smallest L-infinity gap allowed between cube.color and
  # background.floor_rgb. Both are uniform on [0,1]^3 and drawn independently,
  # so without a floor the cube occasionally renders the same colour as the
  # floor behind it and disappears -- an undeclared occlusion, and a genuine
  # injectivity failure: two different cube positions then produce the same
  # image. At 0.2 about 5% of draws are redrawn, which removes the tail without
  # reshaping the style distribution much. 0.0 disables it.
  #
  # Legal only because BOTH axes are style here: two style axes may be made
  # dependent on each other, but rejecting on a *content* coordinate would
  # truncate its marginal. The collector checks and disables itself, loudly,
  # under any profile where cube.color is content.
  min_contrast: 0.2
