# Predictor dataset: physics rollouts on Cube-single.
#
# V1-V4 and V9 deliberately do NOT appear here. This dataset is collected for
# action-space coverage and persistent excitation, not to satisfy a marginal.

defaults:
  - _self_

dataset_name: ogbench/cube_single_predictor.lance
cache_dir: null

# Matches the existing quadruple-DR recipe's scale.
num_traj: 5000
seed: 3072
shard: 0
num_shards: 1

# The encoder dataset this one will be paired with. Its style-randomisation
# range is asserted against, and a mismatch aborts: appearance outside the
# encoder's training range is not covered by the alignment loss and leaks
# straight into the embedding.
profile: physical_content
encoder_dataset: ogbench/cube_single_ou_${profile}.lance

# Fraction of episodes held out as the rollout-distribution eval set. Every
# identifiability metric is reported on both this and the OU eval set.
eval_fraction: 0.1

# Excitation is the design target: a transition model fitted only to expert
# trajectories has never seen the states a planner's candidates will visit.
policy_type: plan_oracle
policy_mixture: 0.25    # fraction of steps drawn at random
p_stack: 0.8

world:
  num_envs: 8
  image_shape: [224, 224]
  max_episode_steps: 400

env:
  env_type: single
  ob_type: pixels
  multiview: false
  visualize_info: false
  pixel_transparent_arm: false
  terminate_at_goal: false
  num_digits: 0
  num_bg_materials: 8
  add_backdrop: true

options:
  variation: ['all']
