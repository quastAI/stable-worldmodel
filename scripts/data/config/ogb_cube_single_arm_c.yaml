# Arms C1 / C2: encoder datasets from *trajectories*, not designed states.
#
# The control that separates "designed data is necessary" from "designed data
# is merely sufficient". No state resets, fixed camera, natural marginal --
# whatever the physics produces.
#
#   C1 (naive)          : consecutive frames as the positive pair.
#   C2 (stride-matched) : frames `frame_stride` apart, tuned so the empirical
#                         per-dim rho lands near the declared rho.
#
# C2 exists because A vs C1 confounds two things: the marginal is no longer
# Gaussian *and* the pair correlation is no longer rho. Matching the stride
# removes the second, so the A->C1 gap can be decomposed rather than merely
# observed. The script reports the achieved rho vector either way.

defaults:
  - _self_

arm: c1                 # c1 | c2
dataset_name: ogbench/cube_single_arm_${arm}.lance
cache_dir: null
write_mode: overwrite

num_episodes: 2000
seed: 3072

# C1 is stride 1 by definition. For C2 this is tuned against the declared rho;
# `null` asks the script to search for it and report what it found.
frame_stride: null

program_constants:
  rho: 0.9
  lambda: 3.0e-3
  seed_budget: 5

latents:
  # NOT `task_content`, and NOT `physical_content`. Arm C rebuilds z from
  # `env.compute_ob_info()`, which carries only privileged/* and proprio/* keys.
  # `task_content`'s cube.color and `physical_content`'s cube.size both read
  # back from `variation.*`, which is not in that dict, so the collector's
  # "every content latent readable" gate would reject every frame and the run
  # would end in `no usable trajectories were collected`.
  #
  # `arm_c_content` is `physical_content` minus cube.size -- the physical DOFs
  # only. Arm C also runs `freeze_appearance: true`, so cube.size would be
  # constant along every trajectory and carry no variance to recover even if it
  # could be read back.
  profile: arm_c_content
  yaw_half_arc: 0.7461282552275249
  include_roll_pitch: false
  include_discrete: false
  pos_z_max: 0.15

env:
  env_type: single
  image_size: 224
  num_digits: 0
  camera: front_pixels
  pixel_transparent_arm: false
  marker:
    enabled: false
    face: top
    scale: 0.85

# Fixed camera and fixed appearance: arm C's whole point is that the data is
# whatever a trajectory gives you, with none of the designed randomisation.
freeze_appearance: true

policy_type: plan_oracle
p_stack: 0.8
max_episode_steps: 400
