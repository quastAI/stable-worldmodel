# Scoring an encoder checkpoint with the frozen metric suite.

defaults:
  - _self_

checkpoint: ???

profile: physical_content
ou_dataset: ogbench/cube_single_ou_${profile}.lance

# Same-content/different-style probe, for the style-invariance metric: the term
# the alignment loss is supposed to discard. Collect it with the OU collector at
# `program_constants.rho=0.99999999` -- the sampler rejects rho=1 outright (the
# paper's rho lies strictly in (0, 1)), and at 1-1e-8 the residual content drift
# is ~7e-4 in z units, sub-pixel once rendered, against ~2.0 for a real step at
# rho=0.9. So the two views share their content for all practical purposes and
# differ only in style.
#
# ARMED BY DEFAULT, and it is not optional instrumentation. With style redrawn
# per view, `epsilon` cannot tell "recovered the latent" from "filled the output
# direction with style noise" -- both give epsilon ~ 0. `sigma_sq` is the only
# quantity that separates them, and it also enters the alignment floor as
# 2*rho*sigma_sq and the gap as delta = delta_content + 2*rho*sigma_sq, so
# without it the reported bound charges style leakage to nonlinearity.
#
#   python scripts/data/collect_cube_single_ou.py \
#       dataset_name=ogbench/cube_single_ou_style_${profile}.lance \
#       program_constants.rho=0.99999999 num_pairs=20000
#
# Set to null only to deliberately record a row without it; `has_style_probe`
# says which rows have one.
style_dataset: ogbench/cube_single_ou_style_${profile}.lance

# WHICH rows to score. `val` reproduces the encoder's own held-out split --
# lejepa.py seeds it with `torch.Generator().manual_seed(seed)` and
# `random_split([train_split, 1 - train_split])`, so the same `seed` and
# `train_split` recover the same indices here.
#
# This defaulted to the whole dataset until 2026-09-11, which meant ~90% of
# every row written was measured on data the encoder had trained on. That is
# not a small bias: on the s3072 50-epoch run it put `L` at 0.98 against a
# floor of 1.87 -- BELOW the floor, impossible for any function of z under the
# declared rho, and possible only because the Hermite floor bounds the
# population rather than a finite sample the encoder had fit. The same weights
# scored on the held-out split by the run's own validation gave an admissible
# delta of 3.6. Recovery numbers were optimistic for the same reason.
#
# `train` scores the complement (useful precisely to measure that gap);
# `all` restores the old behaviour and should be used only deliberately.
# Whichever is chosen is recorded on the row.
split: val

# MUST match the training run's `train_split`, or the reproduced split is a
# blend of both halves and the row is neither held-out nor comparable.
train_split: 0.9

# Refresh BatchNorm running statistics over the eval set before scoring, with
# the weights frozen. ON by default: the default `momentum=0.1` is a ~10-batch
# window, and under a constant learning rate the weights never settle, so the
# statistics a checkpoint carries are both noisy and stale -- and eval mode is
# how every reported number is computed. `bn_recalibrated` is recorded per row,
# so turn this off only to measure the size of the effect, and expect the two
# rows to differ.
recalibrate_batchnorm: true

cache_dir: null
max_samples: 20000
seed: 3072
device: cuda

# Append-only, written from the first run onward: `config_hash`, the `rho` the
# metrics were computed against and the encoder hash cannot be reconstructed
# after the fact. A re-score appends; the reader takes the last row per
# (checkpoint, dataset).
results_path: outputs/lejepa_results.jsonl

# Copied verbatim into every row, so a run that deviates is a visible event.
# `lambda` MUST match what the encoder was trained at -- it is recorded, not
# used, and a mismatch makes two rows silently incomparable.
program_constants:
  rho: 0.9
  lambda: 5.0e-2
