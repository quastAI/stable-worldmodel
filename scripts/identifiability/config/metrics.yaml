# Scoring a checkpoint with the frozen metric suite.

defaults:
  - _self_

checkpoint: ???
arm: A

# BOTH are required for a complete row. The encoder trains on OU-set states and
# the planner only ever sees rollouts; the gap between them is a measurement,
# not a nuisance to be asserted away.
profile: physical_content
ou_dataset: ogbench/cube_single_ou_${profile}.lance
rollout_dataset: ogbench/cube_single_predictor.lance

# Same-content/different-style probe, for the style-invariance metric: the
# term the alignment loss is supposed to discard, and the only thing that
# distinguishes `task_content` from Thm 1's setting. Collect it with the OU
# collector at `program_constants.rho=0.99999999`: the sampler rejects rho=1
# outright (the paper's rho lies strictly in (0, 1)), and at 1-1e-8 the
# residual content drift is ~7e-4 in z units -- sub-pixel once rendered,
# against ~2.0 for a real step at rho=0.9. So the two views of each pair share
# their content for all practical purposes and differ only in style.
# Vacuous under `all_content` (no continuous style left); null skips it.
# e.g. ogbench/cube_single_ou_style_${profile}.lance
style_dataset: null

cache_dir: null
max_samples: 20000
seed: 3072
device: cuda

# Success rates from `scripts/plan/eval_wm.py`, supplying both y-axes.
success_rate: null
success_rate_oracle: null
success_rate_state: null

# Append-only, written from the first run onward: several of its columns
# cannot be reconstructed after the fact.
scatter_path: outputs/lejepa_scatter.jsonl

program_constants:
  rho: 0.9
  lambda: 3.0e-3
  seed_budget: 5
